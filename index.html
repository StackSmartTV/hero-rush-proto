<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2a0f55">
  <title>Hero Rush</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#140726; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
    #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    /* phones: fill the screen. desktops: show a 9:19.5 portrait column */
    #unity-canvas { width:100%; height:100%; display:block; background:#2a0f55; outline:none; }
    @media (min-aspect-ratio: 10/16) { #unity-canvas { height:100%; width:auto; aspect-ratio: 9 / 19.5; } }
    /* ?landscape=1 : fill the whole window (landscape menu layout) */
    body.wide #unity-canvas { width:100% !important; height:100% !important; aspect-ratio:auto !important; }
    #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#ffd61f; font:900 34px/1.1 Impact, 'Arial Black', sans-serif; letter-spacing:2px; text-shadow:3px 3px 0 #000, -2px -2px 0 #000; background:radial-gradient(circle,#4a1fa0 0%,#1b0838 70%); }
    #bar { width:60vw; max-width:320px; height:18px; margin-top:22px; border:4px solid #000; background:#2a1050; border-radius:10px; overflow:hidden; }
    #fill { width:0%; height:100%; background:linear-gradient(#ffe45a,#ff8a10); }
    /* portrait lock: phones turned sideways get a "rotate back" card (the game itself stays portrait) */
    #rotate { position:fixed; inset:0; display:none; z-index:10; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:#f8f0dc; color:#000; font:900 30px/1.15 Impact,'Arial Black',sans-serif; letter-spacing:1px; }
    #rotate b { display:block; background:#ffd61f; border:5px solid #000; box-shadow:7px 7px 0 #000; padding:12px 22px; transform:rotate(-2deg); }
    #rotate i { display:block; margin-top:18px; font-size:64px; font-style:normal; color:#dc1f1f; text-shadow:3px 3px 0 #000; }
    @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) { body:not(.wide) #rotate { display:flex; } }
    #tapstart { position:fixed; inset:0; display:none; z-index:9; align-items:center; justify-content:center; background:rgba(10,4,24,0.55); }
    #tapstart b { background:#ffd61f; color:#000; border:5px solid #000; box-shadow:7px 7px 0 #000; padding:14px 26px; font:900 34px/1 Impact,'Arial Black',sans-serif; letter-spacing:2px; transform:rotate(-2deg); }
    #msg { position:fixed; bottom:12px; left:0; right:0; text-align:center; color:#fff; font:14px sans-serif; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loader">HERO RUSH<div style="font-size:18px;color:#fff;margin-top:8px">LOADING...</div><div id="bar"><div id="fill"></div></div></div>
  <div id="rotate"><b>TURN YOUR PHONE UPRIGHT!</b><i>&#x21bb;</i></div>
  <div id="tapstart"><b>TAP TO START</b></div>
  <div id="msg"></div>
  <script>
    if (/landscape/.test(location.search)) document.body.classList.add("wide");
    // best effort: browsers that allow it (installed PWA / fullscreen on Android) lock to portrait
    function lockPortrait() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(function () {}); } catch (e) {} }
    if (!document.body.classList.contains("wide")) { lockPortrait(); document.addEventListener("pointerdown", lockPortrait, { once: true }); }
    // ---- iOS Safari audio unlock (v0.4.3): track every WebAudio context Unity creates and resume it
    //      inside a real user-gesture handler (touchend / pointerup / click — iOS ignores touchstart).
    (function () {
      var Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
      var ctxs = window.__hrAudioCtxs = [];
      function Wrapped(a, b) { var c = b !== undefined ? new Ctx(a, b) : (a !== undefined ? new Ctx(a) : new Ctx()); ctxs.push(c); return c; }
      Wrapped.prototype = Ctx.prototype;
      window.AudioContext = Wrapped; if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      var done = false, waiting = false;
      function notify(st) {
        console.log('[page] audio ctx state=' + st + ' n=' + ctxs.length);
        document.querySelector('#tapstart').style.display = 'none';
        if (!done && window.unityInstance) { done = true; try { window.unityInstance.SendMessage('AudioManager', 'OnWebAudioUnlocked', st); } catch (e) {} }
      }
      function unlock() {
        ctxs.forEach(function (c) {
          try {
            if (c.state !== 'running') c.resume();
            var b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); // silent kick
          } catch (e) {}
        });
        if (done) return;
        var c0 = ctxs[0];
        if (!c0) { setTimeout(function () { notify('none'); }, 60); return; }
        if (c0.state === 'running') { setTimeout(function () { notify('running'); }, 60); return; }
        // WebKit fires 'statechange' a few hundred ms AFTER resume(); Unity's audio layer only plays (instead of queueing
        // with a bogus "time spent suspended" offset) once its own onstatechange has run — so tell Unity only after that.
        if (waiting) return; waiting = true;
        c0.addEventListener('statechange', function h() {
          if (c0.state !== 'running') return;
          c0.removeEventListener('statechange', h); waiting = false;
          setTimeout(function () { notify('running'); }, 30);
        });
      }
      ['touchend', 'pointerup', 'mouseup', 'click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlock, true); });
      window.__hrAudioState = function () { return ctxs.map(function (c) { return c.state + '@' + c.currentTime.toFixed(2); }).join(','); };
      window.__hrShowTapIfSuspended = function () {
        var sus = ctxs.length && ctxs.some(function (c) { return c.state !== 'running'; });
        if (sus) document.querySelector('#tapstart').style.display = 'flex';
      };
    })();
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Stack Smarter",
      productName: "Hero Rush",
      productVersion: "0.1.0",
      // cap resolution so older iPhones stay smooth
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2.5), // v0.4.3: crisp on iPhone (3x screens capped at 2.5x)
      matchWebGLToCanvasSize: true,
      showBanner: function (m, t) { if (t === 'error') document.querySelector('#msg').textContent = m; console.log(m); }
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector("#fill").style.width = (100 * p) + "%";
      }).then(function (inst) {
        window.unityInstance = inst;
        document.querySelector("#loader").style.display = "none";
        setTimeout(function () { window.__hrShowTapIfSuspended && window.__hrShowTapIfSuspended(); }, 300);
      }).catch(function (m) { document.querySelector('#msg').textContent = m; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
