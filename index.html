<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2a0f55">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Squad Dash">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Super Squad Dash</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#140726; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
    #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
    /* v0.5.1: keep the canvas (and its bottom buttons) above the iPhone home indicator / Safari bottom toolbar and below the notch */
    @supports (padding: env(safe-area-inset-bottom)) { #wrap { top:env(safe-area-inset-top); bottom:env(safe-area-inset-bottom); } }
    /* phones: fill the screen. desktops: show a 9:19.5 portrait column */
    #unity-canvas { width:100%; height:100%; display:block; background:#2a0f55; outline:none; }
    @media (min-aspect-ratio: 10/16) { #unity-canvas { height:100%; width:auto; aspect-ratio: 9 / 19.5; } }
    /* ?landscape=1 : fill the whole window (landscape menu layout) */
    body.wide #unity-canvas { width:100% !important; height:100% !important; aspect-ratio:auto !important; }
    #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#ffd61f; font:900 34px/1.1 Impact, 'Arial Black', sans-serif; letter-spacing:2px; text-shadow:3px 3px 0 #000, -2px -2px 0 #000; background:radial-gradient(circle,#4a1fa0 0%,#1b0838 70%); }
    #loader { font-size:min(34px, 8vw); text-align:center; } /* v0.5.9d longer name fits 320 px phones */
    #copy { position:absolute; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); color:rgba(255,255,255,0.72); font:600 13px/1.2 -apple-system, 'Segoe UI', Arial, sans-serif; letter-spacing:0.4px; text-shadow:1px 1px 0 #000; }
    #bar { width:60vw; max-width:320px; height:18px; margin-top:22px; border:4px solid #000; background:#2a1050; border-radius:10px; overflow:hidden; }
    #fill { width:0%; height:100%; background:linear-gradient(#ffe45a,#ff8a10); }
    /* portrait lock: phones turned sideways get a "rotate back" card (the game itself stays portrait) */
    #rotate { position:fixed; inset:0; display:none; z-index:10; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:#f8f0dc; color:#000; font:900 30px/1.15 Impact,'Arial Black',sans-serif; letter-spacing:1px; }
    #rotate b { display:block; background:#ffd61f; border:5px solid #000; box-shadow:7px 7px 0 #000; padding:12px 22px; transform:rotate(-2deg); }
    #rotate i { display:block; margin-top:18px; font-size:64px; font-style:normal; color:#dc1f1f; text-shadow:3px 3px 0 #000; }
    @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) { body:not(.wide) #rotate { display:flex; } }
    #tapstart { position:fixed; inset:0; display:none; z-index:9; align-items:center; justify-content:center; background:rgba(10,4,24,0.55); }
    #tapstart b { background:#ffd61f; color:#000; border:5px solid #000; box-shadow:7px 7px 0 #000; padding:14px 26px; font:900 34px/1 Impact,'Arial Black',sans-serif; letter-spacing:2px; transform:rotate(-2deg); }
    #msg { position:fixed; bottom:12px; left:0; right:0; text-align:center; color:#fff; font:14px sans-serif; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loader">SUPER SQUAD DASH<div style="font-size:18px;color:#fff;margin-top:8px">LOADING...</div><div id="bar"><div id="fill"></div></div><div id="copy">&copy; 2026 Dade-Made Studios LLC</div></div>
  <div id="rotate"><b>TURN YOUR PHONE UPRIGHT!</b><i>&#x21bb;</i></div>
  <div id="tapstart"><b>TAP TO START</b></div>
  <div id="msg"></div>
  <script>
    if (/landscape/.test(location.search)) document.body.classList.add("wide");
    // best effort: browsers that allow it (installed PWA / fullscreen on Android) lock to portrait
    function lockPortrait() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(function () {}); } catch (e) {} }
    if (!document.body.classList.contains("wide")) { lockPortrait(); document.addEventListener("pointerdown", lockPortrait, { once: true }); }
    // ---- iOS Safari audio unlock (v0.4.3): track every WebAudio context Unity creates and resume it
    //      inside a real user-gesture handler (touchend / pointerup / click — iOS ignores touchstart).
    (function () {
      // v0.4.4: the iPhone ring/silent switch mutes Web Audio (but not media playback). Ask for the 'playback'
      // session (Safari 16.4+/17) up front; older iOS gets the silent <audio> trick inside the first gesture below.
      var session = 'n/a';
      try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; session = navigator.audioSession.type; } } catch (e) { session = 'err'; }
      var Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
      var ctxs = window.__hrAudioCtxs = [];
      // output meter: every connection into a context's destination is mirrored into an AnalyserNode, so the
      // ?fps=1 overlay and the WebKit check can prove real non-silent output (not just an advancing clock)
      var an = [], conn0 = AudioNode.prototype.connect;
      // v0.5.9b loudness: everything Unity sends to the destination goes through one master stage instead: x1.5 (+3.5 dB,
      // ?mgain=1 = old level) baked into a static soft-knee curve (exactly linear below 0.8 FS, smooth tanh knee above,
      // never past full scale) - a waveshaper, not a compressor, so there is no gain riding / pumping. Meter = post-master.
      var dc0 = AudioNode.prototype.disconnect;
      var mg = (function () { var m = /[?&]mgain=([0-9.]+)/.exec(location.search); var g = m ? parseFloat(m[1]) : 1.5; return isFinite(g) && g > 0 ? Math.min(g, 3) : 1.5; })();
      window.__hrMasterGain = mg;
      function softCurve(g) { var n = 4097, cv = new Float32Array(n); for (var i = 0; i < n; i++) { var x = i / (n - 1) * 2 - 1, u = Math.abs(x * g), y = u <= 0.8 ? u : 0.8 + 0.2 * Math.tanh((u - 0.8) / 0.2); cv[i] = x < 0 ? -y : y; } return cv; }
      AudioNode.prototype.connect = function (dst) {
        try { var M = this.context && this.context.__hrMaster; if (dst && M && dst === this.context.destination && this !== M) { conn0.call(this, M); return dst; } } catch (e) {}
        return conn0.apply(this, arguments);
      };
      AudioNode.prototype.disconnect = function (dst) {
        try { var M = this.context && this.context.__hrMaster; if (dst && M && dst === this.context.destination && this !== M) return dc0.call(this, M); } catch (e) {}
        return dc0.apply(this, arguments);
      };
      function meter(c) {
        try { var a = c.createAnalyser(); a.fftSize = 512; c.__hrAn = a; an.push(a); } catch (e) {}
        try { var ws = c.createWaveShaper(); ws.curve = softCurve(mg); ws.oversample = 'none'; conn0.call(ws, c.destination); if (c.__hrAn) conn0.call(ws, c.__hrAn); c.__hrMaster = ws; } catch (e) { console.log('[page] master stage err ' + e); }
      }
      var peak = 0, buf = new Float32Array(512);
      window.__hrAudioLevel = function () {
        var m = 0; an.forEach(function (a) { a.getFloatTimeDomainData(buf); for (var i = 0; i < buf.length; i++) { var v = Math.abs(buf[i]); if (v > m) m = v; } });
        peak = Math.max(m, peak * 0.9); return m;
      };
      window.__hrAudioDebug = function () {
        var c = ctxs[0]; var lv = window.__hrAudioLevel();
        try { if (navigator.audioSession) session = navigator.audioSession.type; } catch (e) {}
        return (c ? c.state + ' ' + c.sampleRate + 'Hz' : 'no-ctx') + ' n=' + ctxs.length + ' lvl=' + lv.toFixed(3) + ' pk=' + peak.toFixed(3) + ' sess=' + session + ' html=' + (silentEl ? (silentEl.paused ? 'paused' : 'on') : '-');
      };
      var silentEl = null;
      function silentMedia() {
        // a looping, NOT muted, silent media element switches older iOS to the playback category (ignores silent switch)
        if (silentEl) { if (silentEl.paused) silentEl.play().catch(function () {}); return; }
        try {
          var n = 4410, b = new ArrayBuffer(44 + n * 2), d = new DataView(b), w = function (o, s) { for (var i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
          w(0, 'RIFF'); d.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
          d.setUint32(24, 44100, true); d.setUint32(28, 88200, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, 'data'); d.setUint32(40, n * 2, true);
          silentEl = document.createElement('audio'); silentEl.setAttribute('playsinline', ''); silentEl.setAttribute('x-webkit-airplay', 'deny');
          silentEl.loop = true; silentEl.preload = 'auto'; silentEl.src = URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
          silentEl.play().catch(function (e) { console.log('[page] silent media play failed ' + e); });
        } catch (e) { console.log('[page] silent media err ' + e); }
      }
      function Wrapped(a, b) { var c = b !== undefined ? new Ctx(a, b) : (a !== undefined ? new Ctx(a) : new Ctx()); ctxs.push(c); meter(c); return c; }
      Wrapped.prototype = Ctx.prototype;
      window.AudioContext = Wrapped; if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      var done = false, waiting = false;
      function notify(st) {
        console.log('[page] audio ctx state=' + st + ' n=' + ctxs.length);
        document.querySelector('#tapstart').style.display = 'none';
        if (!done && window.unityInstance) { done = true; try { window.unityInstance.SendMessage('AudioManager', 'OnWebAudioUnlocked', st); } catch (e) {} }
      }
      function unlock() {
        try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch (e) {}
        silentMedia();
        ctxs.forEach(function (c) {
          try {
            if (c.state !== 'running') c.resume();
            var b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); // silent kick
          } catch (e) {}
        });
        if (done) return;
        var c0 = ctxs[0];
        if (!c0) { setTimeout(function () { notify('none'); }, 60); return; }
        if (c0.state === 'running') { setTimeout(function () { notify('running'); }, 60); return; }
        // WebKit fires 'statechange' a few hundred ms AFTER resume(); Unity's audio layer only plays (instead of queueing
        // with a bogus "time spent suspended" offset) once its own onstatechange has run — so tell Unity only after that.
        if (waiting) return; waiting = true;
        c0.addEventListener('statechange', function h() {
          if (c0.state !== 'running') return;
          c0.removeEventListener('statechange', h); waiting = false;
          setTimeout(function () { notify('running'); }, 30);
        });
      }
      ['touchend', 'pointerup', 'mouseup', 'click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlock, true); });
      // v0.5.6 Flick Shot auto-pause when the tab is hidden or the window loses focus (no-op outside the mini-game)
      (function () { function ap() { try { if (window.unityInstance && window.hrFlickOpen !== false) window.unityInstance.SendMessage('FlickShotGame', 'AutoPause'); } catch (e) {} try { if (window.unityInstance) window.unityInstance.SendMessage('HeroSlashGame', 'AutoPause'); } catch (e) {} }
        document.addEventListener('visibilitychange', function () { if (document.hidden) ap(); }); window.addEventListener('blur', ap); window.addEventListener('pagehide', ap); })();
      // v0.5.8b: also resume on focus / pageshow (bfcache) and log iOS 'interrupted' contexts (phone call, Siri, lock screen);
      // the next tap anywhere runs unlock() again, which resumes them inside a user gesture
      function resumeAll(why) { ctxs.forEach(function (c) { if (c.state !== 'running') { console.log('[page] audio resume (' + why + ') state=' + c.state); try { c.resume(); } catch (e) {} } }); }
      document.addEventListener('visibilitychange', function () { if (!document.hidden) resumeAll('visible'); });
      window.addEventListener('focus', function () { resumeAll('focus'); }); window.addEventListener('pageshow', function () { resumeAll('pageshow'); });
      setInterval(function () { ctxs.forEach(function (c) { if (done && c.state !== 'running' && c.__hrLast !== c.state) console.log('[page] audio ctx ' + c.state); c.__hrLast = c.state; }); }, 2000);
      window.__hrAudioState = function () { return ctxs.map(function (c) { return c.state + '@' + c.currentTime.toFixed(2); }).join(','); };
      window.__hrShowTapIfSuspended = function () {
        var sus = ctxs.length && ctxs.some(function (c) { return c.state !== 'running'; });
        if (sus) document.querySelector('#tapstart').style.display = 'flex';
      };
    })();
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    // v0.5.5 iPhone fix: phones / tablets with ASTC get the ASTC data file (the DXT one is decompressed to RGBA in software
    // on iOS - 4-8x the texture memory; late in a level the boss textures / skin buffers failed). ?astc=0 forces DXT.
    var dataFile = "HeroRush-059d.data.unityweb";
    try {
      var mob = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var gl2 = document.createElement("canvas").getContext("webgl2");
      var astc = (mob && gl2 && gl2.getExtension("WEBGL_compressed_texture_astc") && !/[?&]astc=0/.test(location.search)) || /[?&]astc=1/.test(location.search);
      if (astc) dataFile = dataFile.replace(".data", ".mobile.data");
      window.hrAstc = !!astc; window.hrDataFile = dataFile;
    } catch (e) {}
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/" + dataFile,
      frameworkUrl: buildUrl + "/" + (window.hrAstc ? "HeroRush-059d.framework.js.unityweb".replace(".framework", ".mobile.framework") : "HeroRush-059d.framework.js.unityweb"),
      codeUrl: buildUrl + "/" + (window.hrAstc ? "HeroRush-059d.wasm.unityweb".replace(".wasm", ".mobile.wasm") : "HeroRush-059d.wasm.unityweb"),
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Dade-Made Studios LLC",
      productName: "Super Squad Dash",
      productVersion: "0.1.0",
      // cap resolution so older iPhones stay smooth
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2.5), // v0.4.3: crisp on iPhone (3x screens capped at 2.5x)
      matchWebGLToCanvasSize: true,
      showBanner: function (m, t) { if (t === 'error') document.querySelector('#msg').textContent = m; console.log(m); }
    };
    var script = document.createElement("script");
    script.src = buildUrl + "/HeroRush-059d.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector("#fill").style.width = (100 * p) + "%";
      }).then(function (inst) {
        window.unityInstance = inst;
        document.querySelector("#loader").style.display = "none";
        setTimeout(function () { window.__hrShowTapIfSuspended && window.__hrShowTapIfSuspended(); }, 300);
      }).catch(function (m) { document.querySelector('#msg').textContent = m; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
